#
# SERVER
#
server:
    port: 5402
debug: false

#
# SPRING
#
spring:
    application:
        name: template-springboot-mvc-4x
    quartz:
        auto-startup: false
    servlet:
        multipart:
            max-request-size: 32MB # total request size
            max-file-size: 16MB    # each file size
    main:
        banner-mode: off
    threads:
        virtual:
            enabled: true
    jpa:
